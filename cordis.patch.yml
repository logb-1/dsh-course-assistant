# course-assistant bundle row.
# Tunables live here so a profile upgrade never overwrites them:
#   dataDir      uploads/cache/reports root (default <DSH_HOME>/course-assistant)
#   concurrency  parallel chapter summaries, 1-5 (default 4)
#   withVideos   default true; false skips every Bilibili request
#   provider/model  summary model; omitted = the profile's default model
#   domain       force the course domain, e.g. 'C++' (default: auto-detected
#                from code fragments such as #include / std:: / cout)
#   ocrMaxPages  cap for OCR re-reads (default 60)
#   ocrEngine    force an OCR backend: 'windows' (WinRT) or 'rapidocr' (Python);
#                omitted = the first available one
#   ocrPython    python executable for the rapidocr engine (default: python/python3)
- insert:
    - id: course-assistant
      name: 'dsh-course-assistant'
      config:
        concurrency: 4
        withVideos: true
