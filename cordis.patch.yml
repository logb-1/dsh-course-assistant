# course-assistant bundle row.
# Since 1.4.0 the plugin exports a Schemastery `Config`: every field below is
# validated at activation and editable from the settings page (bad values fail
# loudly instead of starting half-configured). Precedence everywhere:
#   request option > this config > built-in default
# Fields:
#   dataDir          uploads/cache/reports root (default <DSH_HOME>/course-assistant)
#   concurrency      parallel chapter summaries, 1-5 (default 4)
#   withVideos       default true; false skips every Bilibili request
#   domain           force the course domain, e.g. 'C++' (default: auto-detected)
#   ocrMode          'auto' | 'all' | 'off' - page-level triage (default auto:
#                    only pages whose text layer is empty or garbled are re-read)
#   ocrMaxPages      cap for OCR page reads (default 60, 1-400)
#   ocrPick          'first' | 'best' - 'best' re-reads low-score pages with the
#                    second engine and keeps the better text (about 2x slower)
#   ocrEngine        'windows' | 'rapidocr' | '' (auto)
#   ocrPython        python executable for the rapidocr engine
#   images/imagesMax slide-picture OCR: 'ocr' | 'off', max pictures per deck
#   coverage         'auto' | 'fast' | 'thorough' (per-section summaries)
#   reportStyle      'brief' | 'review' - review = 复习资料（模块 K / 实例 E /
#                    习题 Q + 参考答案，token 约 2-3 倍）
#   provider/model   summary model; empty = the profile's default model
#   spacingMs        Bilibili request spacing, >=1000 (default 1000)
#   keepUploadsDays  upload retention (default 7)
- insert:
    - id: course-assistant
      name: 'dsh-course-assistant'
      config:
        concurrency: 4
        withVideos: true
